<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кит</title>
  
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --deep-blue: #0a1128;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      background: radial-gradient(circle at center, #0a1128, #000000 100%);
      color: #b3d3d4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 30px 20px 10px;
      z-index: 10;
      pointer-events: none; 
      background: transparent; 
    }
    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: normal;
      letter-spacing: 4px;
      text-shadow: 
        0 0 50px rgba(0, 243, 255, 0.8),
        0 0 100px rgba(0, 243, 255, 0.5),
        0 0 200px rgba(0, 243, 255, 0.2);
      color: #ffffff;
    }
    p {
      margin: 10px 0 0;
      font-size: 1rem;
      color: #88b0c4;
      letter-spacing: 1px;
    }
    .viewer-container {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }
    model-viewer::part(default-ar-button) {
      background-color: transparent;
      border: 2px solid var(--neon-cyan);
      border-radius: 50px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      color: var(--neon-cyan);
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>свечение бездны</h1>
  </header>

  <div class="viewer-container">
    <model-viewer 
      id="whaleViewer"
      src="assets/whale.glb" 
      alt="3D модель светящегося кита"
      camera-controls 
      auto-rotate 
      ar
      ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1.5"
      environment-image="neutral"
      exposure="1.5"
      camera-orbit="230deg 80deg 14m"
      min-camera-orbit="auto auto 1m"
      max-camera-orbit="auto auto 20m"
      camera-target="0 0.9m 0"
      touch-action="pan-y">
    </model-viewer>
  </div>
</body>
</html>
